name: Bash checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax
        run: bash -n install.sh tests/run.sh
      - name: ShellCheck
        run: shellcheck -x install.sh tests/run.sh
      - name: Behavior
        run: bash tests/run.sh
